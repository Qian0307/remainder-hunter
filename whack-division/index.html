<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>除法打地鼠</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
body{margin:0;font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:linear-gradient(#a8e6ff,#d9f7b8 60%,#9be27a);min-height:100vh;color:#3b2f2f}
#app{max-width:980px;margin:0 auto;padding:12px}
h1{margin:6px 0;font-size:32px}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border-radius:16px;padding:8px 14px;box-shadow:0 3px 0 #0002;font-weight:800}
.top .sp{flex:1}
.pill{background:#fff3b0;border-radius:20px;padding:3px 12px}
.card{background:#fff;border-radius:20px;padding:16px;margin-top:12px;box-shadow:0 4px 0 #0002}
.btn{font:inherit;font-weight:800;font-size:20px;border:0;border-radius:14px;padding:10px 22px;background:#ff8a3d;color:#fff;cursor:pointer;box-shadow:0 4px 0 #b85a14}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b85a14}
.btn:disabled{background:#bbb;box-shadow:0 4px 0 #888;cursor:not-allowed}
.btn.g{background:#37b36b;box-shadow:0 4px 0 #1f7d47}
.btn.b{background:#3d8bff;box-shadow:0 4px 0 #1f5bb8}
.btn.s{font-size:15px;padding:6px 14px}
.lv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.lvc{border-radius:18px;padding:12px;background:#fff8e1;border:3px solid #ffd166;cursor:pointer;text-align:center}
.lvc.lock{filter:grayscale(1);opacity:.5;cursor:not-allowed}
.lvc.boss{border-color:#ff5d5d;background:#ffe9e9}
.stars{font-size:22px;letter-spacing:2px}
.qbox{text-align:center;background:#fffbe6;border:4px solid #ffd166;border-radius:20px;padding:10px;margin-top:10px}
.qbox .q{font-size:46px;font-weight:900;color:#e8420c;letter-spacing:2px}
.qbox small{font-size:18px;color:#6b5b5b;font-weight:700}
.prog{height:12px;background:#eee;border-radius:8px;overflow:hidden;flex:1;min-width:100px}
.prog i{display:block;height:100%;background:#37b36b;transition:width .3s}
.field{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;margin-top:10px;cursor:none}
.cell{position:relative;height:152px;overflow:hidden}
.mound{position:absolute;left:4%;right:4%;bottom:0;height:42px;background:radial-gradient(#8a5a2b,#5f3b19);border-radius:50% 50% 30% 30%/70% 70% 30% 30%;z-index:3}
.mw{position:absolute;left:50%;bottom:20px;width:130px;margin-left:-65px;transform:translateY(130%);transition:transform .16s ease-out;z-index:2;text-align:center}
.mw.up{transform:translateY(0)}
.sign{display:inline-block;background:#fff;border:4px solid #7a4b1e;border-radius:10px;font-weight:900;font-size:25px;padding:0 8px;min-width:68px;box-shadow:0 3px 0 #0003}
.mw.gold .sign{background:#fff3b0;border-color:#e0a800}
.mw.hit .sign{background:#b6f5c8}
.mw.bad .sign{background:#ffc6c6}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
.ovc{background:#fff;border-radius:22px;padding:22px;max-width:560px;width:100%;text-align:center;font-size:24px;font-weight:700}
.ovc b.e{color:#e8420c}
.pop{position:fixed;font-size:30px;font-weight:900;color:#e8a100;pointer-events:none;animation:fly .9s forwards;z-index:15;text-shadow:0 2px 0 #fff}
@keyframes fly{to{transform:translateY(-80px) scale(1.5);opacity:0}}
textarea{width:100%;height:130px;font:inherit;font-size:16px;border-radius:12px;border:2px solid #ccc;padding:8px;-webkit-user-select:text;user-select:text}
.stk{display:inline-block;font-size:38px;margin:2px;filter:grayscale(1);opacity:.25}
.stk.on{filter:none;opacity:1}
input.t{font:inherit;font-size:20px;width:140px;border:2px solid #aaa;border-radius:10px;padding:4px 8px;-webkit-user-select:text;user-select:text}
small{color:#7a6a6a}

:root{--c:#8b5e3c}
body{overflow-x:hidden}
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.cloud{position:absolute;font-size:90px;opacity:.85;animation:drift 60s linear infinite}
.c1{top:6%;left:-150px}.c2{top:18%;left:-150px;animation-duration:85s;animation-delay:-30s;font-size:70px}.c3{top:2%;left:-150px;animation-duration:110s;animation-delay:-70s;font-size:110px}
@keyframes drift{to{transform:translateX(calc(100vw + 300px))}}
.sun{position:absolute;top:3%;right:6%;font-size:80px;animation:spin 40s linear infinite}
.hill{position:absolute;bottom:-60px;left:-10%;width:60%;height:200px;background:#7fd35a;border-radius:50%}
.hill.h2{left:40%;width:70%;background:#6cc24a;bottom:-80px}
.mole{width:120px;height:90px;margin:0 auto;display:block}
.mole svg{width:100%;height:100%;display:block;overflow:visible}
.mascot{width:96px;height:72px;margin:0;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.xeyes,.smug,.dizzy{display:none}
.eyes{animation:blink 3.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.nose{animation:nose 1s infinite;transform-box:fill-box;transform-origin:center}
@keyframes nose{50%{transform:scale(1.18)}}
.mw{transition:transform .24s cubic-bezier(.3,1.7,.5,1)}
.mw.up .mole{animation:emerge .4s ease-out,idle 1.3s .4s ease-in-out infinite;transform-origin:50% 100%}
.mw.up .sign{animation:wob .6s}
@keyframes emerge{0%{transform:scale(1.15,.7)}55%{transform:scale(.92,1.14)}100%{transform:scale(1)}}
@keyframes idle{50%{transform:rotate(2.5deg) translateY(-3px)}}
@keyframes wob{0%{transform:rotate(-10deg)}30%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
.mw.hit .mole{animation:squash .3s ease-out forwards;transform-origin:50% 100%}
.mw.hit .eyes,.mw.bad .eyes,.mw.hit .teeth,.mw.bad .teeth{display:none}
.mw.hit .xeyes{display:block}
.mw.hit .dizzy{display:block;transform-box:view-box;transform-origin:50px 22px;animation:spin 1s linear infinite}
.mw.bad .smug{display:block}
.mw.bad .mouth{display:none}
.mw.bad .mole{animation:laugh .45s ease-in-out infinite;transform-origin:50% 100%}
@keyframes squash{0%{transform:scale(1)}40%{transform:scale(1.3,.55)}100%{transform:scale(1.1,.8)}}
@keyframes laugh{25%{transform:rotate(-7deg) scale(1.05)}75%{transform:rotate(7deg) scale(1.05)}}
.mw.gold svg{animation:glow .7s infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 3px gold)}to{filter:drop-shadow(0 0 16px #ffd23f)}}
.dirt{position:absolute;bottom:36px;width:9px;height:9px;border-radius:50%;background:#7a4b1e;z-index:4;pointer-events:none;animation:dirt .55s ease-out forwards}
@keyframes dirt{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.spk{position:fixed;font-size:22px;pointer-events:none;z-index:16;animation:spk .65s ease-out forwards}
@keyframes spk{from{transform:translate(-50%,-50%) scale(.5)}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3);opacity:0}}
.pow{position:fixed;font-weight:900;font-size:36px;color:#fff;-webkit-text-stroke:2px #e8420c;paint-order:stroke;pointer-events:none;z-index:17;animation:pw .7s ease-out forwards;white-space:nowrap}
@keyframes pw{0%{transform:translate(-50%,-50%) scale(.3) rotate(-12deg)}30%{transform:translate(-50%,-90%) scale(1.3) rotate(6deg)}100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
.ring{position:fixed;width:20px;height:20px;border:4px solid #fff;border-radius:50%;pointer-events:none;z-index:15;animation:rg .4s ease-out forwards}
@keyframes rg{from{transform:translate(-50%,-50%) scale(.5)}to{transform:translate(-50%,-50%) scale(4);opacity:0}}
#hammer{position:fixed;left:0;top:0;pointer-events:none;z-index:30;display:none}
#hammer .hm{width:50px;height:90px;transform-origin:25px 17px;transform:rotate(22deg);transition:transform .08s}
#hammer.swing .hm{animation:swing .2s ease-out}
@keyframes swing{0%{transform:rotate(22deg)}35%{transform:rotate(-38deg) scale(.88)}100%{transform:rotate(22deg)}}
.field.shake{animation:shk .38s}
@keyframes shk{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
#flash{position:fixed;inset:0;background:rgba(255,40,40,.28);pointer-events:none;z-index:14;animation:fl .4s forwards}
@keyframes fl{to{opacity:0}}
.qbox.qin{animation:qin .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes qin{from{transform:translateY(-30px) scale(.9);opacity:0}}
.qbox.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.06);border-color:#37b36b;background:#e7ffe9}}
.cf{position:fixed;top:-20px;width:10px;height:16px;z-index:40;pointer-events:none;animation:cf 3.2s linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
.st{display:inline-block;animation:stin .5s both cubic-bezier(.3,1.8,.5,1)}
@keyframes stin{from{transform:scale(0) rotate(-90deg)}}

.shop{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.item{text-align:center;background:#fff8e1;border:3px solid #ffd166;border-radius:16px;padding:8px 12px;min-width:118px}
.item.use{border-color:#37b36b;background:#e7ffe9}
.hv{height:72px;display:flex;justify-content:center}.hv svg{height:72px;width:auto}
#hammer.flame::after{content:'🔥';position:absolute;left:8px;top:-28px;font-size:30px;animation:fl2 .3s infinite alternate}
@keyframes fl2{to{transform:scale(1.2) translateY(-4px)}}
.hp{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:6px 14px;margin-top:8px;box-shadow:0 3px 0 #0002;font-weight:800}
.hpb{height:16px;background:#ddd;border-radius:10px;overflow:hidden;margin-top:3px;border:2px solid #7a2b2b}
.hpb i{display:block;height:100%;width:100%;background:linear-gradient(#ff6b6b,#d63b3b);transition:width .4s}
.mole.king{width:76px;height:57px;margin:0}
.king.hurt{animation:hurt .45s}
.king.hurt .eyes,.king.taunt .eyes,.king.defeat .eyes{display:none}
.king.hurt .xeyes,.king.defeat .xeyes{display:block}
.king.taunt{animation:laugh .5s 2}
.king.taunt .smug{display:block}.king.taunt .mouth,.king.taunt .teeth{display:none}
.king.defeat{animation:defeat 1.3s forwards}
@keyframes hurt{20%{transform:translateX(-8px) rotate(-8deg);filter:brightness(2)}60%{transform:translateX(8px) rotate(8deg)}}
@keyframes defeat{30%{transform:scale(1.5) rotate(20deg)}100%{transform:translateY(140px) rotate(200deg) scale(.3);opacity:0}}
.banner{position:fixed;top:300px;left:50%;transform:translateX(-50%);z-index:25;pointer-events:none;font-size:34px;font-weight:900;color:#fff;background:linear-gradient(90deg,#ff5a1f,#ffb100);padding:8px 26px;border-radius:30px;border:4px solid #fff;box-shadow:0 6px 0 #0003;white-space:nowrap;animation:bn 1.9s forwards}
@keyframes bn{0%{transform:translateX(-50%) scale(.2) rotate(-6deg);opacity:0}15%{transform:translateX(-50%) scale(1.15);opacity:1}25%{transform:translateX(-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-30px)}}
.fever .sky{animation:rb 2.5s linear infinite}
@keyframes rb{to{filter:hue-rotate(360deg)}}
.fever .qbox{border-color:#ff5a1f;box-shadow:0 0 22px #ff9a5a}
.mw.rb svg{animation:rbw 1.2s linear infinite}
@keyframes rbw{to{filter:hue-rotate(360deg) drop-shadow(0 0 8px #fff)}}
.mw.rb .sign::before{content:'💎 '}
.say{position:fixed;transform:translate(-50%,-100%);background:#fff;border:3px solid #333;border-radius:14px;padding:4px 10px;font-weight:900;font-size:18px;z-index:18;pointer-events:none;white-space:nowrap;animation:sayin 1s forwards}
@keyframes sayin{0%{transform:translate(-50%,-70%) scale(.3)}15%{transform:translate(-50%,-100%) scale(1.1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%)}}
</style>
</head>
<body>
<div class="sky"><div class="sun">☀️</div><i class="cloud c1">☁️</i><i class="cloud c2">☁️</i><i class="cloud c3">☁️</i><div class="hill"></div><div class="hill h2"></div></div>
<div id="app"></div>
<div id="hammer"><div class="hm"></div></div>
<script>
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const FACES=['🐹','🐭','🐰','🐻','🐼','🦫'];
const STK=['🔨','🥕','⭐','🏅','🎯','🧲','🚀','🍀','🏆','👑'];
const LV=[null,
{t:'地鼠新兵',d:'÷2、÷3',mode:'Q',ks:[2,3],q:[1,6],n:12,up:3400,gap:1000,max:2},
{t:'二到五的除法',d:'÷2~÷5',mode:'Q',ks:[2,3,4,5],q:[1,9],n:14,up:3100,gap:950,max:3},
{t:'找朋友大作戰',d:'一次打出所有答案相同的算式',mode:'M',ks:[2,3,4,5],q:[2,9],n:6,up:3300,gap:900,max:3},
{t:'六到九的除法',d:'÷6~÷9',mode:'Q',ks:[6,7,8,9],q:[1,9],n:14,up:3100,gap:900,max:3},
{t:'全部混在一起',d:'÷2~÷9',mode:'Q',ks:[2,3,4,5,6,7,8,9],q:[1,9],n:16,up:2800,gap:850,max:3,king:1},
{t:'找朋友進階',d:'答案相同的算式 ÷2~÷9',mode:'M',ks:[2,3,4,5,6,7,8,9],q:[2,9],n:6,up:3000,gap:800,max:4},
{t:'兩位數的除法',d:'例如 48 ÷ 4',mode:'Q',ks:[2,3,4,5],q:[10,19],n:12,up:3500,gap:900,max:3},
{t:'有餘數的地鼠',d:'答案寫成「商…餘數」',mode:'Q',rem:1,ks:[2,3,4,5],q:[1,9],n:12,up:3700,gap:950,max:3},
{t:'餘數大挑戰',d:'÷3~÷9 有餘數',mode:'Q',rem:1,ks:[3,4,5,6,7,8,9],q:[2,9],n:14,up:3500,gap:900,max:3},
{t:'地鼠王 BOSS',d:'全部綜合・金色地鼠加倍',mode:'X',ks:[2,3,4,5,6,7,8,9],q:[2,9],n:16,up:2900,gap:800,max:4,boss:1,king:1}
];
let S={name:'軒瑀',coins:0,done:{},sound:1};
try{const x=JSON.parse(localStorage.getItem('whackDiv1'));if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem('whackDiv1',JSON.stringify(S))}catch(e){}};
if(!S.owned)S.owned=['red'];if(!S.hammer)S.hammer='red';if(S.total==null)S.total=S.coins;
let AC;
function beep(f,d,t){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'triangle';o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const sGood=(n=0)=>{const b=660+Math.min(n,8)*55;beep(b,.1);setTimeout(()=>beep(b*1.5,.16),90)};
const bonk=()=>{beep(140,.12,'square');beep(70,.18,'sine')};
const fanfare=()=>[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,.2),i*110));
const sBad=()=>beep(150,.35,'sawtooth');
const sPop=()=>beep(300+R(0,80),.05);


const COLS=['#8b5e3c','#7d7d8a','#a0724a','#6b5b95','#5e8c6a'];
const MOLE=`<svg viewBox="0 0 100 84" xmlns="http://www.w3.org/2000/svg">
<circle cx="22" cy="24" r="11" fill="var(--c)"/><circle cx="22" cy="24" r="5.5" fill="#f4a6b5"/>
<circle cx="78" cy="24" r="11" fill="var(--c)"/><circle cx="78" cy="24" r="5.5" fill="#f4a6b5"/>
<ellipse cx="50" cy="52" rx="38" ry="34" fill="var(--c)"/>
<ellipse cx="50" cy="63" rx="24" ry="18" fill="#f2d3ae"/>
<g class="eyes"><circle cx="35" cy="44" r="6" fill="#222"/><circle cx="65" cy="44" r="6" fill="#222"/><circle cx="37" cy="42" r="2" fill="#fff"/><circle cx="67" cy="42" r="2" fill="#fff"/></g>
<g class="xeyes"><path d="M29 38l12 12M41 38l-12 12M59 38l12 12M71 38l-12 12" stroke="#222" stroke-width="4" stroke-linecap="round"/></g>
<g class="smug"><path d="M29 46q6-8 12 0M59 46q6-8 12 0" stroke="#222" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M43 66q7 12 14 0z" fill="#e0507a"/></g>
<ellipse class="nose" cx="50" cy="57" rx="9" ry="6" fill="#ff8fa3"/>
<path class="mouth" d="M42 66q8 7 16 0" stroke="#7a3b2b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<rect class="teeth" x="46" y="68" width="8" height="7" rx="2" fill="#fff" stroke="#bbb"/>
<g class="dizzy"><text x="8" y="14" font-size="14">⭐</text><text x="40" y="8" font-size="14">💫</text><text x="76" y="14" font-size="14">⭐</text></g>
<ellipse cx="20" cy="80" rx="12" ry="8" fill="#f4a6b5"/><ellipse cx="80" cy="80" rx="12" ry="8" fill="#f4a6b5"/>
</svg>`;
function dirt(h){const cell=h.el.parentElement;for(let i=0;i<6;i++){const d=document.createElement('i');d.className='dirt';d.style.setProperty('--dx',R(-60,60)+'px');d.style.setProperty('--dy',-R(25,60)+'px');d.style.left=(40+R(0,20))+'%';cell.appendChild(d);setTimeout(()=>d.remove(),600)}}
function sparkle(el){
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*0.4;
  for(let i=0;i<9;i++){const s=document.createElement('div');s.className='spk';s.textContent=pick(HAMMERS[S.hammer].fx);s.style.left=cx+'px';s.style.top=cy+'px';const a=Math.PI*2*i/9,d=R(50,90);s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),700)}
  const p=document.createElement('div');p.className='pow';p.textContent=pick(['POW!','BONK!','好耶!','讚!']);p.style.left=cx+'px';p.style.top=cy+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),750);
}
function shake(){const f=$('#field');if(f){f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')}const fl=document.createElement('div');fl.id='flash';document.body.appendChild(fl);setTimeout(()=>fl.remove(),420)}
function bump(){const q=$('#qb');if(q){q.classList.remove('bump','qin');void q.offsetWidth;q.classList.add('bump')}}
function confetti(){const cs=['#ff5d5d','#ffd166','#37b36b','#3d8bff','#b66bff','#ff8a3d'];for(let i=0;i<70;i++){const d=document.createElement('i');d.className='cf';d.style.left=R(0,100)+'vw';d.style.background=pick(cs);d.style.animationDelay=(Math.random()*1.2)+'s';d.style.animationDuration=(2.4+Math.random()*1.6)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),5200)}}
function starsBig(n){let h='<div class="stars" style="font-size:54px">';for(let i=0;i<3;i++)h+=i<n?`<span class="st" style="animation-delay:${.25+i*.3}s">⭐</span>`:'☆';return h+'</div>'}
const HM=()=>$('#hammer');
function hideHammer(){const h=HM();if(h)h.style.display='none'}
document.addEventListener('pointermove',e=>{const h=HM();if(!h)return;if(L&&e.target.closest&&e.target.closest('.field')){h.style.display='block';h.style.transform=`translate(${e.clientX-25}px,${e.clientY-17}px)`}else h.style.display='none'});
document.addEventListener('pointerdown',e=>{
  if(!(L&&e.target.closest&&e.target.closest('.field')))return;
  const h=HM();h.style.display='block';h.style.transform=`translate(${e.clientX-25}px,${e.clientY-17}px)`;
  h.classList.remove('swing');void h.offsetWidth;h.classList.add('swing');
  const r=document.createElement('div');r.className='ring';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),420);
});


const HAMMERS={
 red:{n:'紅色大鎚',p:0,head:'#e04b43',hi:'#ff9c93',edge:'#8f1f1a',fx:['⭐','✨','💥']},
 gold:{n:'黃金鎚',p:150,head:'#f2b705',hi:'#fff3a0',edge:'#9a6f00',fx:['⭐','✨','🪙']},
 ice:{n:'冰凍鎚',p:300,head:'#5ec8f2',hi:'#d8f4ff',edge:'#1c7da6',fx:['❄️','✨','💎']},
 rainbow:{n:'彩虹鎚',p:500,rb:1,head:'#fff',hi:'#fff',edge:'#6b3fa0',fx:['🌈','✨','🎉']},
 fire:{n:'火焰鎚',p:800,head:'#ff6a1f',hi:'#ffd166',edge:'#a02c00',fx:['🔥','✨','💥']}
};
function hammerSVG(id){const H=HAMMERS[id];const f=H.rb?`url(#rbg)`:H.head;
 return `<svg width="50" height="90" viewBox="0 0 50 90"><defs><linearGradient id="rbg" x1="0" x2="1"><stop offset="0" stop-color="#ff5d5d"/><stop offset=".25" stop-color="#ffd166"/><stop offset=".5" stop-color="#37b36b"/><stop offset=".75" stop-color="#3d8bff"/><stop offset="1" stop-color="#b66bff"/></linearGradient></defs><rect x="21" y="26" width="9" height="62" rx="4" fill="#a8672d" stroke="#6b3f17" stroke-width="2"/><rect x="4" y="3" width="42" height="28" rx="8" fill="${f}" stroke="${H.edge}" stroke-width="2.5"/><rect x="8" y="7" width="34" height="8" rx="4" fill="${H.hi}" opacity=".7"/></svg>`}
function setHammer(){const h=HM();if(!h)return;h.querySelector('.hm').innerHTML=hammerSVG(S.hammer);h.classList.toggle('flame',S.hammer==='fire')}
function buy(id){const H=HAMMERS[id];if(S.coins<H.p||S.owned.includes(id))return;S.coins-=H.p;S.owned.push(id);S.hammer=id;save();setHammer();fanfare();home()}
function equip(id){if(!S.owned.includes(id))return;S.hammer=id;save();setHammer();sPop();home()}
const KING=MOLE.replace('</svg>','<path d="M28 20l6-16 10 9 6-13 6 13 10-9 6 16z" fill="#ffd23f" stroke="#c99200" stroke-width="2"/></svg>');
function kingFx(cls){const k=$('#king');if(!k)return;k.classList.remove('hurt','taunt','defeat');void k.offsetWidth;k.classList.add(cls)}
function say(el,txt){const r=el.getBoundingClientRect();const d=document.createElement('div');d.className='say';d.textContent=txt;d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
function startFever(){L.fever=4;document.body.classList.add('fever');fanfare();const b=document.createElement('div');b.className='banner';b.textContent='🔥 FEVER 模式!接下來 3 題金幣 ×2';document.body.appendChild(b);setTimeout(()=>b.remove(),1900)}
function endFever(){if(L)L.fever=0;document.body.classList.remove('fever')}
function cbText(){return `🔥連擊 ${L.combo}`+(L.fever>0?' ⚡FEVER×2':'')}

/* ---------- question generation ---------- */
function genQ(cfg){
  let kind=cfg.mode;
  if(kind==='X')kind=pick(['Q','Q','Qr','M']);
  const rem=cfg.rem||kind==='Qr';
  if(kind==='M'||cfg.mode==='M'){
    const T=R(cfg.q[0],Math.min(cfg.q[1],9)),ks=cfg.mode==='X'?[2,3,4,5,6,7,8,9]:cfg.ks;
    return {kind:'M',T,ks,qr:cfg.q,need:3,key:'找'+T};
  }
  const ks=(cfg.mode==='X'&&rem)?[3,4,5,6,7,8,9]:cfg.ks;
  const k=pick(ks);
  let q=R(cfg.q[0],cfg.q[1]);
  let r=rem?R(0,k-1):0;
  const N=k*q+r;
  let ans,pool;
  if(rem){
    ans=`${q}…${r}`;
    const c=[[q,r+1],[q,r-1],[q+1,r],[q-1,r],[q,r+k],[r,q],[q+1,r+1]];
    pool=[...new Set(c.filter(([a,b])=>a>=0&&b>=0&&!(a===q&&b===r)).map(([a,b])=>`${a}…${b}`))];
  }else{
    ans=String(q);
    const s=new Set([q+1,q-1,q+2,q-2,q+3,k,k+q,N,q*2]);
    if(q>=10){s.add(+String(q).split('').reverse().join(''));s.add(q+10);s.add(q-10)}
    pool=[...s].filter(x=>x>0&&x!==q&&x<=200).map(String);
  }
  return {kind:'Q',N,k,q,r,rem,ans,pool,key:`${N}÷${k}`};
}
function buildQueue(cfg){
  const qs=[];let g=0;
  while(qs.length<cfg.n){const o=genQ(cfg);if(qs.length&&qs[qs.length-1].key===o.key&&g++<10)continue;qs.push(o)}
  return qs;
}

/* ---------- screens ---------- */
function topbar(extra){
  return `<div class="top"><span>🔨 除法打地鼠</span><span class="pill">👤 ${S.name}</span><span class="pill">🪙 ${S.coins}</span>${extra||''}<span class="sp"></span><button class="btn s b" onclick="S.sound=!S.sound;save();this.textContent=S.sound?'🔊':'🔇'">${S.sound?'🔊':'🔇'}</button></div>`;
}
function home(){
  stopAll();L=null;hideHammer();document.body.classList.remove('fever');
  let h=topbar()+`<div class="card"><div style="display:flex;align-items:center;gap:14px"><div class="mole mascot">${MOLE}</div><h1>🔨 除法打地鼠</h1></div>
  <div style="font-size:20px;font-weight:700">地鼠會舉著牌子,牌子上寫著答案。<br>👉 <b style="color:#e8420c">只有答案正確的地鼠才可以打!</b> 打錯會被暫停講解喔。</div>
  <div style="margin-top:8px">貼紙冊:${STK.map((s,i)=>`<span class="stk ${S.done[i+1]?'on':''}">${s}</span>`).join('')}</div></div>
  <div class="card"><b style="font-size:22px">🛒 鎚子商店</b> <small>用金幣買新鎚子,打中會有不同特效!</small><div class="shop">${Object.entries(HAMMERS).map(([id,H])=>{const own=S.owned.includes(id),use=S.hammer===id;return `<div class="item ${use?'use':''}"><div class="hv">${hammerSVG(id)}</div><b>${H.n}</b><br>${own?(use?'<span class="pill">使用中</span>':`<button class="btn s g" onclick="equip('${id}')">使用</button>`):`<button class="btn s" ${S.coins>=H.p?'':'disabled'} onclick="buy('${id}')">🪙${H.p} 購買</button>`}</div>`}).join('')}</div></div>
  <div class="card"><div class="lv">`;
  for(let i=1;i<LV.length;i++){
    const c=LV[i],dn=S.done[i],lock=i>1&&!S.done[i-1];
    h+=`<div class="lvc ${lock?'lock':''} ${c.king?'boss':''}" ${lock?'':`onclick="intro(${i})"`}><b style="font-size:19px">第${i}關</b><br>${c.t}<br><small>${c.d}</small><br>${c.king?'<b>👑 地鼠王</b><br>':''}<span class="stars">${lock?'🔒':(dn?'⭐'.repeat(dn.stars)+'☆'.repeat(3-dn.stars):'☆☆☆')}</span></div>`;
  }
  h+=`</div></div><div class="card"><small>店長名字:</small> <input class="t" value="${S.name}" onchange="S.name=this.value||'小朋友';save();home()"> <button class="btn s" style="background:#999;box-shadow:0 3px 0 #666" onclick="if(this.dataset.c){S={name:S.name,coins:0,done:{},sound:S.sound,owned:['red'],hammer:'red',total:0};save();home()}else{this.dataset.c=1;this.textContent='再按一次確認清除'}">重新開始</button></div>`;
  $('#app').innerHTML=h;
}
function overlay(html){const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML=`<div class="ovc">${html}</div>`;document.body.appendChild(o)}
function closeOv(){const o=$('#ov');o&&o.remove()}

function intro(i){
  const c=LV[i];
  let rule;
  if(c.mode==='M')rule=`上面會寫一個數字,例如 <b class="e">答案是 6</b>。<br>地鼠頭上是算式,<b>只打算出來等於它的算式</b>,打到 3 隻就過關!`;
  else if(c.mode==='X')rule=`綜合挑戰!有「算式」題、「商…餘數」題,還有<b class="e">金色地鼠</b>(打對加倍)。`;
  else if(c.rem)rule=`題目是 <b class="e">23 ÷ 5</b>,答案要寫成「<b>商…餘數</b>」,<br>例如 4…3。只打<b>完全正確</b>的那隻!`;
  else rule=`題目是 <b class="e">24 ÷ 4 = ?</b><br>地鼠頭上的牌子寫著答案,<b>只打答案正確的地鼠</b>!`;
  if(c.king)rule+=`<br>👑 <b>打倒地鼠王!</b>答對一題,他的血量就會減少。`;
  overlay(`<div style="font-size:30px">第${i}關 ${c.t}</div><div style="margin:12px 0">${rule}</div><div style="font-size:18px;color:#c33">打到錯的會暫停,要看完講解才能繼續。</div><button class="btn g" style="margin-top:14px" onclick="closeOv();startLevel(${i})">開始!</button> <button class="btn s" style="background:#999;box-shadow:0 3px 0 #666" onclick="closeOv()">返回</button>`);
}

/* ---------- engine ---------- */
let L=null;
function later(fn,ms){const id=setTimeout(()=>{L&&L.timers.delete(id);fn()},ms);L&&L.timers.add(id);return id}
function stopAll(){if(!L)return;L.timers.forEach(clearTimeout);L.timers.clear();L.paused=true}
function startLevel(i){
  const cfg=LV[i];
  L={i,cfg,queue:buildQueue(cfg),qi:0,coins:0,combo:0,wrong:0,right:0,first:0,total:0,facts:{},timers:new Set(),paused:true,since:0,fever:0,t0:Date.now(),holes:[]};
  let h=topbar(`<span class="pill">第${i}關</span><span class="prog"><i id="pg" style="width:0"></i></span><span class="pill" id="qn"></span><span class="pill" id="cb"></span>`);
  h+=`${cfg.king?`<div class="hp"><div class="mole king" id="king">${KING}</div><div style="flex:1">👑 地鼠王 HP<div class="hpb"><i id="hp"></i></div></div></div>`:''}<div class="qbox" id="qb"></div><div class="field" id="field">`;
  for(let c=0;c<9;c++)h+=`<div class="cell"><div class="mw" id="m${c}"><div class="sign"></div><div class="mole">${MOLE}</div></div><div class="mound"></div></div>`;
  h+=`</div><div style="margin-top:8px;text-align:center"><button class="btn s" style="background:#999;box-shadow:0 3px 0 #666" onclick="if(confirm_())home()">離開</button></div>`;
  $('#app').innerHTML=h;
  L.holes=[...Array(9)].map((_,c)=>({el:$('#m'+c),m:null}));
  L.holes.forEach((hh,c)=>{hh.el.parentElement.addEventListener('pointerdown',e=>{e.preventDefault();whack(c)})});
  setHammer();
  nextQ();
}
function confirm_(){return true}
function head(){
  const q=L.cur;
  $('#pg').style.width=(L.qi/L.queue.length*100)+'%';
  $('#qn').textContent=`第 ${Math.min(L.qi+1,L.queue.length)} / ${L.queue.length} 題`;
  $('#cb').textContent=cbText();
  if(L.cfg.king){const hp=$('#hp');if(hp)hp.style.width=((L.queue.length-L.qi)/L.queue.length*100)+'%'}
  let t;
  if(q.kind==='M')t=`<div class="q">答案是 ${q.T}</div><small>打出所有「算出來等於 ${q.T}」的算式 (${q.got}/${q.need})</small>`;
  else if(q.rem)t=`<div class="q">${q.N} ÷ ${q.k} = ?</div><small>答案寫成「商…餘數」</small>`;
  else t=`<div class="q">${q.N} ÷ ${q.k} = ?</div><small>只打答案正確的地鼠</small>`;
  $('#qb').innerHTML=t;
}
function nextQ(){
  clearMoles();
  if(L.qi>=L.queue.length){if(L.cfg.king){kingFx('defeat');beep(200,.5,'sawtooth');setTimeout(fanfare,500);L.paused=true;later(endLevel,1700);return}return endLevel()}
  L.cur=L.queue[L.qi];L.cur.wrong=0;L.cur.got=0;L.since=0;
  head();{const qb=$('#qb');qb.classList.remove('bump','qin');void qb.offsetWidth;qb.classList.add('qin')}
  L.paused=false;
  later(tick,500);
}
function clearMoles(){L.holes.forEach(h=>{if(h.m){clearTimeout(h.m.tm);h.m=null;h.el.className='mw';h.el.classList.remove('up')}})}
function tick(){
  if(!L||L.paused)return;
  spawn();
  later(tick,L.cfg.gap*(0.8+Math.random()*.5));
}
function upVals(){return L.holes.filter(h=>h.m).map(h=>h.m.val)}
function spawn(){
  const free=L.holes.filter(h=>!h.m),cur=L.cur,cfg=L.cfg;
  if(!free.length||L.holes.length-free.length>=cfg.max)return;
  const h=pick(free),ups=upVals();
  let val,correct=false;
  if(cur.kind==='Q'){
    const cUp=L.holes.some(x=>x.m&&x.m.correct);
    if(!cUp&&(L.since>=2||Math.random()<.4)){correct=true;val=cur.ans;L.since=0}
    else{
      const opts=cur.pool.filter(v=>!ups.includes(v));
      if(!opts.length)return;
      val=pick(opts);L.since++;
    }
  }else{
    const ok=Math.random()<.5;
    for(let g=0;g<12;g++){
      const k=pick(cur.ks);let a;
      if(ok)a=cur.T;else{do{a=Math.random()<.7?cur.T+pick([-2,-1,1,2]):R(cur.qr[0],Math.min(cur.qr[1],9))}while(a===cur.T||a<1)}
      const txt=`${a*k}÷${k}`;
      if(!ups.includes(txt)){val=txt;correct=ok;h.eq={N:a*k,k,a};break}
    }
    if(!val)return;
  }
  const gold=cfg.boss&&correct&&cur.kind==='Q';
  const rb=!gold&&correct&&Math.random()<.12;
  h.m={val,correct,gold,rb,eq:h.eq,tm:0,dead:false};
  h.el.querySelector('.sign').textContent=val;
  h.el.style.setProperty('--c',gold?'#f2b705':rb?'#ff6fa5':pick(COLS));
  h.el.className='mw'+(gold?' gold':'')+(rb?' rb':'');
  void h.el.offsetWidth;h.el.classList.add('up');dirt(h);
  h.m.tm=setTimeout(()=>{if(h.m&&!h.m.dead){h.el.classList.remove('up');const mm=h.m;setTimeout(()=>{if(h.m===mm)h.m=null},200)}},cfg.up*(0.85+Math.random()*.3));
}
function burst(el,txt,col){
  const r=el.getBoundingClientRect(),d=document.createElement('div');
  d.className='pop';d.textContent=txt;if(col)d.style.color=col;
  d.style.left=(r.left+r.width/2-30)+'px';d.style.top=(r.top)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),900);
}
function whack(c){
  if(!L||L.paused)return;
  const h=L.holes[c];if(!h.m||h.m.dead)return;
  const m=h.m,cur=L.cur;
  m.dead=true;clearTimeout(m.tm);
  if(m.correct){
    h.el.classList.add('hit');sparkle(h.el);
    L.right++;
    let g=10+Math.min(L.combo,5)*2;if(cur.wrong>0)g=5;if(m.gold)g*=2;if(m.rb)g+=30;if(L.fever>0)g*=2;
    L.combo++;L.coins+=g;S.coins+=g;S.total=(S.total||0)+g;save();sGood(L.combo);bonk();kingFx('hurt');burst(h.el,(m.rb?'💎+':'+')+g);if(L.combo%5===0&&!(L.fever>0))startFever();if(L.combo>=3&&L.combo%3===0)burst($('#qb'),'🔥連擊 x'+L.combo,'#ff5a1f');bump();
    setTimeout(()=>{h.el.classList.remove('up');setTimeout(()=>{if(h.m===m)h.m=null},200)},350);
    if(cur.kind==='M'){cur.got++;head();if(cur.got>=cur.need)return qDone()}
    else return qDone();
    $('#cb').textContent=cbText();
  }else{
    h.el.classList.add('bad');shake();kingFx('taunt');say(h.el,pick(['嘿嘿~被騙了!','我是假的!哈哈','答案不是我~','再想想喔!']));if(L.fever>0)endFever();
    L.wrong++;cur.wrong++;L.combo=0;sBad();
    const key=cur.kind==='M'?m.val:cur.key;
    L.facts[key]=(L.facts[key]||0)+1;
    stopAll();
    setTimeout(()=>explain(m),450);
  }
}
function qDone(){
  const cur=L.cur;L.paused=true;L.timers.forEach(clearTimeout);L.timers.clear();
  L.total++;if(cur.wrong===0)L.first++;if(L.fever>0){L.fever--;if(L.fever<=0)endFever()}
  if(cur.wrong>0&&!cur.retry&&cur.kind==='Q'){L.queue.splice(Math.min(L.qi+4,L.queue.length),0,Object.assign({},cur,{retry:true,wrong:0}))}
  L.qi++;
  later(nextQ,700);
}
function explain(m){
  const cur=L.cur;let body;
  if(cur.kind==='M'){
    const e=m.eq;
    body=`你打到 <b class="e">${e.N} ÷ ${e.k} = ${e.a}</b><br>因為 ${e.k} × ${e.a} = ${e.N}。<br>但我們要找的是答案 <b class="e">${cur.T}</b> 的算式喔!`;
  }else if(cur.rem){
    const [a,b]=m.val.split('…').map(Number);
    let why=`${cur.k} × ${a} + ${b} = ${cur.k*a+b},不是 ${cur.N}。`;
    if(b>=cur.k)why=`餘數 ${b} 比 ${cur.k} 還大,還可以再裝一組,所以不對。`;
    body=`你打到 <b class="e">${m.val}</b><br>${why}<br>正確是 <b class="e">${cur.ans}</b>:${cur.k} × ${cur.q} + ${cur.r} = ${cur.N}`;
  }else{
    const v=+m.val;
    body=`你打到 <b class="e">${m.val}</b><br>${cur.k} × ${v} = ${cur.k*v},不是 ${cur.N}。<br>正確答案是 <b class="e">${cur.q}</b>:${cur.k} × ${cur.q} = ${cur.N}`;
  }
  overlay(`<div style="font-size:30px">😜 這隻是陷阱地鼠!</div><div style="margin:12px 0;line-height:1.6">${body}</div><button class="btn g" id="cont" disabled>看完了(3)</button>`);
  let n=3;const b=$('#cont');
  const iv=setInterval(()=>{n--;if(n>0)b.textContent=`看完了(${n})`;else{clearInterval(iv);b.disabled=false;b.textContent='繼續打!'}},1000);
  b.onclick=()=>{closeOv();clearMoles();L.paused=false;head();later(tick,500)};
}
function endLevel(){
  document.body.classList.remove('fever');const cfg=L.cfg,i=L.i,n=L.total;
  const stars=L.wrong<=1?3:L.wrong<=4?2:1;
  const prev=S.done[i];if(!prev||stars>=prev.stars)S.done[i]={stars};
  save();
  const mins=Math.max(1,Math.round((Date.now()-L.t0)/60000));
  const wf=Object.entries(L.facts).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>`${k}(${v}次)`).join('、')||'無';
  const rep=`【除法打地鼠】${S.name} 第${i}關「${cfg.t}」\n共 ${n} 題,一次就對 ${L.first} 題,打錯陷阱 ${L.wrong} 次\n最常打錯:${wf}\n用時約 ${mins} 分鐘,本關獲得 ${L.coins} 金幣,累計 ${S.total||0} 金幣`;
  const hasNext=i<LV.length-1;
  $('#app').innerHTML=topbar()+`<div class="card" style="text-align:center"><h1>🎉 第${i}關完成!</h1>${starsBig(stars)}
  <div style="font-size:24px;font-weight:800">${STK[i-1]} 獲得新貼紙!<br>一次就對 ${L.first} / ${n} 題 · 🪙 +${L.coins}</div></div>
  <div class="card"><b>📋 請複製這段傳給老師(Discord)</b><br><textarea id="rep" readonly>${rep}</textarea>
  <button class="btn b" onclick="copyRep()">複製成績</button> <span id="cp"></span></div>
  <div class="card" style="text-align:center">${hasNext?`<button class="btn g" onclick="intro(${i+1})">下一關 ➜</button> `:'<h2>🏆 你是地鼠王!全部通關!</h2>'}<button class="btn" onclick="home()">回關卡地圖</button></div>`;
  sGood();L.paused=true;confetti();hideHammer();
}
function copyRep(){
  const t=$('#rep');t.select();let ok=false;
  try{navigator.clipboard.writeText(t.value).then(()=>$('#cp').textContent='✅ 已複製',()=>{});ok=true}catch(e){}
  try{if(document.execCommand('copy')){ok=true;$('#cp').textContent='✅ 已複製'}}catch(e){}
  if(!ok)$('#cp').textContent='請選取文字後按 Ctrl+C';
}
setHammer();home();
</script>
