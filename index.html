<title>餘數獵人</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: 單欄、無選單。上方關卡進度，中間怪獸＋裝袋畫面，下方作答區。老師看板為另一個畫面。 */
:root{--bg:#14102b;--bg2:#1c1640;--panel:#272052;--panel2:#332b69;--line:#4a4090;--fg:#f6f3ff;--mute:#b9b0e6;
--gold:#ffd23f;--gold-d:#b98a00;--mint:#4fe3b0;--mint-d:#1b8f6b;--coral:#ff6f7d;--coral-d:#b63a49;--sky:#6cc6ff;--violet:#8f6bff;--violet-d:#5333c9;--orange:#ff9f45;--ink:#241a00;color-scheme:dark}
*{box-sizing:border-box}
body{background:radial-gradient(900px 520px at 85% -8%,#2d2070 0,transparent 60%),radial-gradient(700px 520px at -10% 35%,#1d2f6e 0,transparent 55%),#14102b;background-color:var(--bg);background-repeat:no-repeat;background-attachment:fixed;color:var(--fg);
font:500 16px/1.55 'Fredoka','Noto Sans TC',system-ui,sans-serif;min-height:100%;
padding-block:8px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#top,#app,#foot{max-width:900px;margin-inline:auto}
h1,h2,h3{font-weight:900;margin:0;text-wrap:balance;letter-spacing:.02em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.topin{display:flex;align-items:center;gap:10px;padding:4px 0 8px}
.logo{background:none;border:0;font-weight:900;font-size:1.05rem;letter-spacing:.08em;cursor:pointer;color:var(--gold);padding:4px 0;white-space:nowrap}
.pcs{display:flex;gap:4px;align-items:center;min-width:0;flex-wrap:wrap}
.pc{width:30px;height:30px;border-radius:10px;background:var(--panel);display:grid;place-items:center;padding:3px;opacity:.85}
.pc svg{width:100%;height:100%}
.pc:not(.done):not(.cur) svg{filter:brightness(0);opacity:.28}
.pc.cur{box-shadow:0 0 0 3px var(--gold);opacity:1}
.sp{flex:1}
.ibtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--panel);cursor:pointer;display:grid;place-items:center}
.ibtn svg{width:20px;height:20px}
.btn{background:var(--violet);color:#fff;border:0;border-radius:16px;padding:11px 20px;font-weight:900;font-size:1.02rem;box-shadow:0 5px 0 var(--violet-d);cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s;letter-spacing:.03em}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--violet-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--gold-d)}
.btn.gold:active:not(:disabled){box-shadow:0 1px 0 var(--gold-d)}
.btn.mint{background:var(--mint);color:#06281d;box-shadow:0 5px 0 var(--mint-d)}
.btn.mint:active:not(:disabled){box-shadow:0 1px 0 var(--mint-d)}
.btn.ghost{background:var(--panel2);box-shadow:0 4px 0 #1b1540}
.btn.coral{background:var(--coral);color:#33050b;box-shadow:0 5px 0 var(--coral-d)}
.btn.big{font-size:1.2rem;padding:13px 26px}
.btn.sm{padding:7px 14px;font-size:.9rem;box-shadow:0 3px 0 #1b1540;border-radius:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.panel{background:var(--panel);border-radius:22px;padding:16px;margin-top:12px}
small,.mute{color:var(--mute)}
/* HUD */
.hud{display:flex;gap:14px;align-items:center;border-radius:24px;padding:12px 16px;background:linear-gradient(135deg,var(--sk1),var(--sk2));position:relative;overflow:hidden}
.hud .mw{width:104px;flex:none;position:relative}
.hud .mw svg{display:block;width:100%;overflow:visible}
.hud .mon .body{animation:bob 2.4s ease-in-out infinite}
.hud .mon.hit .body{animation:hit .35s}
.hud .mon.defeated .body{animation:defeat .75s forwards}
.hinfo{flex:1;min-width:0}
.hinfo h2{font-size:1.25rem}
.hinfo .goal{color:#ffffffcc;font-size:.92rem}
.hpbar{height:14px;border-radius:99px;background:#0007;overflow:hidden;margin-top:8px}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),#ffa07a);transition:width .35s}
.hmeta{display:flex;gap:12px;margin-top:6px;font-weight:700;font-size:.92rem;color:#ffffffd9}
.combo{color:var(--gold);font-weight:900}
.float{position:absolute;z-index:5;font:700 1.5rem Fredoka,sans-serif;pointer-events:none;animation:rise 1s ease-out forwards;text-shadow:0 2px 0 #0008;color:var(--gold)}
/* 裝袋畫面 */
.vis{background:var(--panel);border-radius:20px;padding:14px;margin-top:10px;text-align:center}
.dots{display:grid;grid-template-columns:repeat(10,var(--ds,20px));gap:6px;justify-content:center;margin-inline:auto}
.dots i{width:var(--ds,20px);height:var(--ds,20px);border-radius:50%;background:#ffffff55;transition:transform .2s,background .2s,box-shadow .2s}
.dots i.c0{background:var(--sky)}.dots i.c1{background:var(--violet)}.dots i.c2{background:var(--mint)}.dots i.c3{background:var(--orange)}
.dots i.rem{background:var(--gold);box-shadow:0 0 14px var(--gold);animation:pulse .8s ease-in-out infinite}
.bags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;min-height:8px}
.bag{background:#0006;border:2px solid var(--line);border-radius:12px;padding:1px 10px;font-weight:700;font-size:.9rem}
.bag.c0{border-color:var(--sky)}.bag.c1{border-color:var(--violet)}.bag.c2{border-color:var(--mint)}.bag.c3{border-color:var(--orange)}
.dlabel{margin-top:8px;min-height:1.7em;font-weight:700}
.dlabel b{color:var(--gold);font-size:1.15em}
.slots{display:flex;gap:8px;justify-content:center;margin:6px 0}
.slots i{width:22px;height:22px;border-radius:50%;border:3px dashed #ffffff88}
/* 題目 */
.story{font-size:1.18rem;font-weight:700;line-height:1.7}
.story b{color:var(--gold)}
.story small{font-weight:500}
.eqrow{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.eqt{font:700 1.9rem/1 'Fredoka','Noto Sans TC',sans-serif;padding-bottom:16px}
.slotbox{display:flex;flex-direction:column;gap:3px;align-items:center}
.slotbox small{font-weight:700;white-space:nowrap}
.slot{min-width:78px;height:64px;border-radius:16px;background:var(--bg2);border:3px solid var(--line);display:grid;place-items:center;font:700 2.1rem Fredoka,sans-serif;cursor:pointer;padding-inline:10px}
.slot.active{border-color:var(--gold);box-shadow:0 0 0 4px #ffd23f33}
.slot.empty{color:#ffffff40}
.slot.good{border-color:var(--mint);background:#1f5e4d}
.slot.bad{border-color:var(--coral);background:#5e2434}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:480px;margin:12px 0}
.key{height:48px;border-radius:14px;border:0;background:var(--panel2);font:700 1.35rem Fredoka,sans-serif;cursor:pointer;box-shadow:0 3px 0 #1b1540}
.key:active{transform:translateY(3px);box-shadow:none}
.key.del{background:#4a3a7e;font-size:1.1rem}
.hinttext{margin-top:10px;color:var(--mute);font-weight:700}
.ladder{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ladder span{padding:4px 9px;border-radius:10px;background:var(--bg2);font:700 1rem Fredoka,sans-serif;color:#ffffff55}
.ladder span.lit{background:#2a7fb8;color:#fff}
.exlines{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.exlines div{background:var(--bg2);border-radius:14px;padding:9px 14px;font-weight:700;animation:fadein .4s}
.exlines b{color:var(--gold)}
.copyhint{margin:12px 0 0;font-weight:900;color:var(--mint)}
.fb{margin-top:12px;border-radius:16px;padding:12px 16px;font-weight:700;background:var(--panel2)}
.fb.ok{background:#1b5d4b;border:2px solid var(--mint)}
.fb.bad{background:#5b2335;border:2px solid var(--coral)}
.fb .big{font:700 1.5rem Fredoka,sans-serif}
.actions{margin-top:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
kbd{background:#0005;border-radius:6px;padding:0 6px;font-size:.8rem}
.shake{animation:shake .3s}
/* 教學 / 過關 / 結束 */
.demo,.brk{padding:6px 0}
.tag{display:inline-block;background:var(--violet);border-radius:999px;padding:1px 14px;font-weight:900;letter-spacing:.1em;font-size:.85rem}
.demo h2,.brk h2{font-size:1.9rem;margin:8px 0 2px}
.steps{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.step{background:var(--panel);border-radius:18px;padding:14px 18px;font-size:1.2rem;font-weight:700;line-height:1.8;animation:fadein .4s}
.step b{color:var(--gold)}
.brk{text-align:center}
.brk .rm{width:min(190px,50vw);margin:0 auto}
.brk .rm>div{animation:bob 2.4s ease-in-out infinite}
.brk h2{color:var(--gold)}
.rstat{list-style:none;padding:0;margin:14px auto;max-width:400px;background:var(--panel);border-radius:20px;text-align:left}
.rstat li{display:flex;justify-content:space-between;gap:12px;padding:9px 18px;border-bottom:1px solid var(--line)}
.rstat li:last-child{border:0}
.rep{max-width:560px;margin:14px auto;background:var(--panel);border-radius:20px;padding:14px 16px;text-align:left}
.rep p{margin:0 0 10px}
textarea{width:100%;min-height:150px;background:var(--bg2);color:var(--fg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font:500 .95rem/1.6 'Fredoka','Noto Sans TC',sans-serif;resize:vertical}
.conf{position:absolute;top:-20px;font-size:1.2rem;animation:fall 2.6s linear forwards;pointer-events:none}
.brk{position:relative;overflow:hidden}
/* 頁尾 */
#foot{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:.85rem;color:var(--mute);flex-wrap:wrap}
.sd{width:10px;height:10px;border-radius:50%;background:#7b72b3;display:inline-block}
.sd.live{background:var(--mint);box-shadow:0 0 8px var(--mint)}
.sd.off{background:var(--coral)}
/* 老師看板 */
.tv h2{font-size:1.6rem}
.tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.tc{background:var(--panel);border-radius:18px;padding:12px 14px}
.tc b{display:block;font:700 1.7rem Fredoka,sans-serif;color:var(--gold)}
.tc span{font-size:.85rem;color:var(--mute)}
.tbar{height:12px;border-radius:99px;background:#0006;overflow:hidden;margin-top:8px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sky))}
.trow{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:8px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center;font-size:.92rem}
.trow.h{color:var(--mute);font-weight:700;font-size:.8rem}
.trow.lg{grid-template-columns:54px minmax(0,1.5fr) minmax(0,1.3fr) minmax(0,1.1fr) 40px 50px}
.trow .ok{color:var(--mint);font-weight:900}.trow .no{color:var(--coral);font-weight:900}
.scroll{overflow-x:auto}
.scroll>div{min-width:520px}
.sess{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sess .btn.sel{background:var(--gold);color:var(--ink);box-shadow:0 3px 0 var(--gold-d)}
.flag{display:inline-block;background:#5b2335;border:1px solid var(--coral);border-radius:999px;padding:0 10px;margin:2px 6px 2px 0;font-size:.85rem;font-weight:700}
.flag.g{background:#1b5d4b;border-color:var(--mint)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes hit{0%{transform:none}20%{transform:translateX(-12px) scale(.9,1.1)}45%{transform:translateX(9px) scale(1.07,.93)}100%{transform:none}}
@keyframes defeat{0%{transform:scale(1);opacity:1}35%{transform:scale(1.18) rotate(-6deg)}100%{transform:scale(0) rotate(40deg);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-10px) scale(1.1)}100%{transform:translateY(-70px) scale(1);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (max-width:560px){.hud .mw{width:72px}.hinfo h2{font-size:1.05rem}.eqt{font-size:1.5rem;padding-bottom:18px}.slot{min-width:62px}.pad{grid-template-columns:repeat(5,1fr)}.pcs{gap:3px;flex-wrap:nowrap}.pc{width:22px;height:22px;padding:2px;border-radius:8px}.logo{font-size:.9rem}.topin{gap:8px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
/* ===== 試煉地圖 ===== */
.maphead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 6px}
.maphead h2{font-size:1.35rem}
.mapwrap{position:relative;aspect-ratio:800/520;border-radius:26px;background:linear-gradient(160deg,#243a78,#1b2a5c 45%,#2a2060);padding:6px;margin-top:6px;overflow:hidden}
.map{position:absolute;inset:0;width:100%;height:100%;display:block}
.mpath{fill:none;stroke:#ffffff30;stroke-width:12;stroke-linecap:round;stroke-dasharray:2 20;vector-effect:non-scaling-stroke}
.mpath.done{vector-effect:non-scaling-stroke;stroke:var(--gold);stroke-dasharray:none;stroke-width:8;opacity:.8}
.mn{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;cursor:pointer;width:96px;padding:0}
.mn .orb{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:1.9rem;background:var(--violet);box-shadow:0 5px 0 var(--violet-d);border:3px solid #fff4}
.mn.lock{cursor:not-allowed}.mn.lock .orb{background:#3b3566;box-shadow:0 5px 0 #231d44;filter:grayscale(.8);opacity:.7}
.mn.done .orb{background:var(--mint);box-shadow:0 5px 0 var(--mint-d)}
.mn.cur .orb{background:var(--gold);box-shadow:0 5px 0 var(--gold-d);animation:bob 1.2s ease-in-out infinite}
.mn.boss .orb{width:76px;height:76px;font-size:2.3rem}
@keyframes bob{50%{transform:translateY(-6px)}}
.mn .nm{font-weight:900;font-size:.82rem;background:#14102bcc;border-radius:10px;padding:1px 8px;white-space:nowrap}
.mn .st{font-size:.9rem;letter-spacing:2px;color:var(--gold);min-height:1.2em}
.tcard{background:var(--panel);border-radius:22px;padding:16px;margin-top:12px}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qbar{flex:1;height:12px;border-radius:8px;background:var(--bg2);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--mint);transition:width .3s}
.mlist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.mlist li{background:var(--bg2);border-radius:12px;padding:8px 12px;font-weight:700}
.mlist li b{color:var(--gold)}.mlist li .bd{color:var(--coral)}.mlist li .gd{color:var(--mint)}
.bigstar{font-size:2.2rem;letter-spacing:6px;color:var(--gold)}
.tb{width:100%;border-collapse:collapse;font-size:.92rem}
.tb th,.tb td{padding:5px 8px;text-align:left;border-bottom:1px solid #ffffff1a}
.tb tr.x td{color:var(--coral)}
pre.rep{white-space:pre-wrap;background:var(--bg2);border-radius:14px;padding:12px;font:500 .95rem/1.6 'Noto Sans TC',sans-serif;margin:8px 0}
@media (max-width:560px){.mapwrap{aspect-ratio:4/5}.mn{width:72px}.mn .orb{width:48px;height:48px;font-size:1.4rem}.mn.boss .orb{width:56px;height:56px;font-size:1.7rem}.mn .nm{font-size:.7rem;padding:0 5px}}

</style>
<div id="top"></div>
<main id="app"></main>
<div id="foot"></div>
<script>
'use strict';
/* ===== 題庫、關卡與統計（純函式，可在 node 測試） ===== */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r;};
const rep=(k,n)=>Array(n).fill(k);
const PP=(dmin,dmax,qmin,qmax,r0,nmax)=>({dmin,dmax,qmin,qmax,r0,nmax});
const P7=PP(3,9,2,9,.1,89);

const CTX=[
 {item:'糖果',cl:'顆',box:'袋',v:'裝'},{item:'彈珠',cl:'顆',box:'盒',v:'裝'},
 {item:'餃子',cl:'顆',box:'盤',v:'放'},{item:'鉛筆',cl:'枝',box:'盒',v:'裝'},
 {item:'卡片',cl:'張',box:'疊',v:'放'},{item:'餅乾',cl:'片',box:'包',v:'裝'},
 {item:'氣球',cl:'顆',box:'串',v:'綁'},{item:'貼紙',cl:'張',box:'頁',v:'貼'},
 {item:'蘋果',cl:'顆',box:'籃',v:'放'}
];
const WHO=['小明','小美','阿虎','小雪','米米','大熊','小豆'];

const KIND_LABEL={pack:'裝袋練習',see:'看圖說餘數',calc:'乘法找餘數',maxrem:'餘數最大是多少',fix:'找出錯誤',
 dividendS:'驗算（有引導）',dividend:'驗算',solveDS:'倒推除數（有引導）',solveD:'倒推除數',
 wordqr:'應用題（商和餘數）',wordr:'應用題（剩下幾個）',wordneed:'應用題（再多幾個）',wordbox:'應用題（至少幾個盒子）'};

const STAGES=[
 {id:1,name:'認識餘數',goal:'把水晶裝袋，看看最後剩下什麼',seed:3,plan:rep('pack',6),P:PP(2,4,2,4,.12,19)},
 {id:2,name:'看圖說餘數',goal:'不用自己裝袋，用眼睛看出來',seed:14,plan:rep('see',10),P:PP(2,6,2,6,.12,39)},
 {id:3,name:'用乘法找餘數',goal:'沒有圖也能算出來',seed:8,plan:rep('calc',14),P:PP(3,9,2,9,.12,89),
  demo:[
   '題目：<b>17 ÷ 5</b>，意思是「17 裡面，最多有幾個 5？」',
   '先把 5 的乘法排出來：<br><b>5×1=5　5×2=10　5×3=15　5×4=20</b>',
   '<b>20</b> 比 17 大，超過了！所以最多是 <b>3</b> 個 5。<br>商 ＝ 3',
   '剩下多少？<b>17 − 15 ＝ 2</b>。餘數 ＝ 2',
   '餘數 2 比 5 小，裝不了第 4 袋了。<br><b>17 ÷ 5 ＝ 3 … 2</b>',
   '不會的時候可以按「提示」，會跳出乘法梯。但是要你自己找出「最大、而且不超過」的那一個喔！']},
 {id:4,name:'餘數要比除數小',goal:'餘數太大，表示還可以再裝',seed:6,plan:[...rep('maxrem',3),...rep('fix',7)],P:PP(3,9,2,9,.1,89),
  demo:[
   '小豆說：<b>23 ÷ 5 ＝ 3 … 8</b>',
   '驗算：5 × 3 ＋ 8 ＝ 23，好像沒錯？',
   '可是餘數 <b>8</b> 比除數 <b>5</b> 還大！剩下的 8 顆，還可以再裝一袋。',
   '多裝一袋：商變成 <b>4</b>，餘數變成 8 − 5 ＝ <b>3</b>。',
   '記住：<b>餘數一定要比除數小</b>。<br>23 ÷ 5 ＝ 4 … 3']},
 {id:5,name:'驗算',goal:'除數 × 商 ＋ 餘數 ＝ 被除數',seed:11,plan:[...rep('dividendS',4),...rep('dividend',6)],P:PP(2,9,2,9,.12,89),
  demo:[
   '怎麼知道 <b>17 ÷ 5 ＝ 3 … 2</b> 有沒有算對？',
   '用驗算：<b>除數 × 商 ＋ 餘數 ＝ 被除數</b>',

function rndDiv(Pp,recent,kind,opt){
  opt=opt||{};
  for(let t=0;t<120;t++){
    const d=(opt.fixD&&t<80)?opt.fixD:ri(Pp.dmin,Pp.dmax);
    const q=ri(Pp.qmin,Pp.qmax);
    let r=Math.random()<Pp.r0?0:ri(1,d-1);
    if(opt.needR&&r===0)r=ri(1,d-1);
    const N=d*q+r;
    if(N>Pp.nmax||d<2)continue;
    const key=kind+':'+N+':'+d;
    if(t<100&&recent.includes(key))continue;
    recent.push(key);if(recent.length>30)recent.shift();
    return {N,d,q,r};
  }
  const d=opt.fixD||3;return {N:d*4+1,d,q:4,r:1};
}

function diagQR(Q){

function bonusKind(G){

    if(cand.length&&st[cand[0]].ft/st[cand[0]].n<.8)return cand[0];
  }
  return pick(pool);
}
function summarize(G){
  const S={total:0,ok:0,ft:0,quick:0,hintN:0,failN:0,byKind:{},byStage:{},wrong:{}};
  for(const e of (G.log||[])){
    S.total++;if(e.ok)S.ok++;if(e.ft)S.ft++;if(e.q)S.quick++;if(e.h>0)S.hintN++;if(!e.ok)S.failN++;
    const bk=S.byKind[e.k]||(S.byKind[e.k]={n:0,ft:0,ms:0});bk.n++;if(e.ft)bk.ft++;bk.ms+=e.ms||0;
    if(!e.rm){const bs=S.byStage[e.s]||(S.byStage[e.s]={n:0,ok:0,ft:0,ms:0});bs.n++;if(e.ok)bs.ok++;if(e.ft)bs.ft++;bs.ms+=e.ms||0;}
    if(!e.ft)S.wrong[e.x]=(S.wrong[e.x]||0)+1;
  }
  S.wrongList=Object.entries(S.wrong).sort((a,b)=>b[1]-a[1]);
  return S;
}

const starStr=n=>'⭐'.repeat(n)+'☆'.repeat(3-n);
const nodeTotal=i=>NODES[i].k.reduce((a,b)=>a+b[1],0);
const isDone=i=>!!(T.nodes[i]&&T.nodes[i].done);
const avail=i=>i===0||isDone(i-1);

/* --- 同步到老師 --- */
const SYNC={db:null,state:'init',busy:false,dirty:false,timer:null};
const payload=()=>({v:1,sid:T.sid,startedAt:T.startedAt||Date.now(),updatedAt:Date.now(),nodes:T.nodes,log:T.log.slice(-200)});
async function initSync(){
  try{SYNC.db=(window.claude&&window.claude.use)?await window.claude.use('db'):null;}catch(e){SYNC.db=null;}
  SYNC.state=SYNC.db?'ready':'off';renderFoot();if(SYNC.db&&T.log.length)queueSync();
}
function queueSync(){if(!SYNC.db||SYNC.state==='noperm')return;if(SYNC.busy){SYNC.dirty=true;return;}clearTimeout(SYNC.timer);SYNC.timer=setTimeout(doSync,1000);}
async function doSync(){
  if(!SYNC.db||SYNC.busy)return;SYNC.busy=true;
  try{await SYNC.db.doc('trials/'+T.sid).set(payload());SYNC.state='live';}
  catch(e){if(e&&e.code==='invalid_argument')SYNC.state='noperm';else if(e&&(e.code==='unavailable'||e.code==='resource_exhausted')){SYNC.busy=false;setTimeout(queueSync,4000);return;}else SYNC.state='off';}
  SYNC.busy=false;renderFoot();if(SYNC.dirty){SYNC.dirty=false;queueSync();}
}
function renderFoot(){
  if(!ACTIVE)return;
  const m={init:['#888','連線中…'],ready:['#6cc6ff','已連線'],live:['#4fe3b0','成績已傳給老師'],noperm:['#ff9f45','沒有權限：完成後請按「複製回報」貼給老師'],off:['#ff9f45','離線：完成後請按「複製回報」貼給老師']}[SYNC.state]||['#888',''];
  footEl.innerHTML=`<div class="foot"><i style="background:${m[0]}"></i>${m[1]}</div>`;
}

/* --- 回報文字 --- */
const dl=()=>{const d=new Date();return (d.getMonth()+1)+'/'+d.getDate();};
function buildReport(){
  const L=T.log,ok=L.filter(e=>e.ok).length;
  const lines=['【餘數試煉】'+dl()+' 軒瑀'];
  const first=new Map();L.forEach(e=>{const k=e.i+'-'+e.q+'-'+e.at;});
  lines.push(`總共答 ${L.length} 題，答對 ${ok} 題（${L.length?Math.round(ok/L.length*100):0}%）`);
  const quick=L.filter(e=>e.quick).length;if(quick)lines.push(`太快作答（2 秒內）${quick} 題`);
  NODES.forEach((nd,i)=>{const s=T.nodes[i];if(!s)return;lines.push(`第${i+1}關 ${nd.n}：最佳 ${s.best}/${nodeTotal(i)} ${starStr(stars(s.best/nodeTotal(i)))}（挑戰 ${s.tries} 次）`);});
  const bad=L.filter(e=>!e.ok);
  if(bad.length){lines.push('答錯：');bad.slice(-14).forEach(e=>lines.push(`・第${e.i+1}關 ${e.disp}　他寫 ${e.got}　正解 ${e.want}`));}
  let s=lines.join('\n');if(s.length>1900)s=s.slice(0,1890)+'…';return s;
}
async function copyText(t,btn){
  try{await navigator.clipboard.writeText(t);}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(_){}ta.remove();}
  if(btn){const o=btn.textContent;btn.textContent='已複製 ✓';setTimeout(()=>btn.textContent=o,1600);}
}

/* --- 地圖 --- */
let MODE='map',R=null;
function curIdx(){for(let i=0;i<NODES.length;i++)if(!isDone(i))return i;return -1;}
function showMap(){
  MODE='map';R=null;
  const cur=curIdx(),doneN=NODES.filter((_,i)=>isDone(i)).length;
  const pts=NODES.map(n=>`${n.x*8},${n.y*5.2}`);
  const d='M'+pts.join(' L');
  const dd=doneN>0?'M'+pts.slice(0,Math.min(doneN+1,pts.length)).join(' L'):'';
  topEl.innerHTML=`<div class="topin"><button class="logo" data-act="t_logo">餘數試煉</button><span class="sp"></span><small>${doneN} / ${NODES.length} 關</small><button class="btn sm ghost" data-act="t_tolesson">回教學</button></div>`;
  app.innerHTML=`<div class="maphead"><h2>闖關地圖</h2><small>每關自己作答，沒有提示。按順序一關一關闖，答完會知道正確答案。</small></div>
  <div class="mapwrap"><svg class="map" viewBox="0 0 800 520" preserveAspectRatio="none" aria-hidden="true"><path class="mpath" d="${d}"/>${dd?`<path class="mpath done" d="${dd}"/>`:''}</svg>
  ${NODES.map((n,i)=>{const s=T.nodes[i],st=isDone(i)?stars(s.best/nodeTotal(i)):0;const c=!avail(i)?'lock':isDone(i)?'done':i===cur?'cur':'';
   return `<button class="mn ${c} ${n.boss?'boss':''}" style="left:${n.x}%;top:${n.y}%" data-act="t_node" data-i="${i}" ${avail(i)?'':'aria-disabled="true"'}><span class="orb">${avail(i)?n.e:'🔒'}</span><span class="nm">${i+1}. ${esc(n.n)}</span><span class="st">${isDone(i)?starStr(st):''}</span></button>`;}).join('')}
  </div>
  <div class="row" style="margin-top:12px">${cur===-1?'<button class="btn gold" data-act="t_allend">看總成績</button>':`<button class="btn gold big" data-act="t_node" data-i="${cur}">出發：第 ${cur+1} 關</button>`}${T.log.length?'<button class="btn ghost sm" data-act="t_copy">複製回報給老師</button>':''}</div>`;
}

/* --- 出題 --- */
function build(i){
  const nd=NODES[i],P=stageP(nd.st),recent=[],qs=[];
  const kinds=shuffle(nd.k.flatMap(([k,c])=>Array(c).fill(k)));
  // 讓關卡內容大致由易到難：保留原本順序（k 的順序），只在同類型內不重複
  const ordered=nd.k.flatMap(([k,c])=>Array(c).fill(k));
  (nd.boss?shuffle(ordered):ordered).forEach(k=>{const Q=genQ(k,P,{recent});recent.push(Q.key);qs.push(Q);});
  return qs;
}
const stageP=id=>STAGES.find(s=>s.id===id).P;
function startNode(i){
  if(!avail(i))return;
  if(!T.startedAt){T.startedAt=Date.now();}
  R={i,qs:build(i),n:0,ok:0,res:[],phase:'ask',vals:{},active:null,t0:0,lockUntil:0};
  MODE='quiz';nextQ(true);
}
function nextQ(first){
  const Q=R.qs[R.n];R.Q=Q;R.vals={};R.active=Q.fields[0].k;R.phase='ask';R.t0=Date.now();
  const nd=NODES[R.i],tot=R.qs.length;
  topEl.innerHTML=`<div class="topin"><button class="logo" data-act="t_logo">餘數試煉</button><span class="sp"></span><button class="btn sm ghost" data-act="t_tomap">回地圖</button></div>`;
  let vis='';
  if(Q.vis==='dots')vis=`<div class="vis"><div class="dots" style="--ds:${Q.N<=20?26:Q.N<=40?22:17}px">${'<i></i>'.repeat(Q.N)}</div><div class="dlabel">每 ${Q.d} 顆裝一袋</div></div>`;
  else if(Q.kind==='maxrem')vis=`<div class="vis"><div class="slots">${'<i></i>'.repeat(Q.d)}</div><div class="dlabel">一個袋子剛好可以裝 <b>${Q.d}</b> 顆</div></div>`;
  app.innerHTML=`<section>
   <div class="qtop"><b>${nd.e} 第 ${R.i+1} 關・${esc(nd.n)}</b><span class="sp"></span><small>第 ${R.n+1} / ${tot} 題</small></div>
   <div class="qbar"><i style="width:${R.n/tot*100}%"></i></div>${vis}
   <div class="tcard"><div class="story">${Q.story}</div>
    <div id="ans"><div id="eqs"></div>
     <div class="pad">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button class="key" data-act="t_key" data-k="${n}">${n}</button>`).join('')}<button class="key del" data-act="t_del" aria-label="刪除">⌫</button><button class="key del" data-act="t_clear">清除</button></div>
     <div class="row"><button class="btn mint big" id="submitbtn" data-act="t_submit" disabled>確認答案</button></div></div>
    <div class="fb" id="fb" hidden></div><div class="row" id="nextrow" style="margin-top:10px"></div></div></section>`;
  renderEq();
}
function renderEq(){
  const Q=R.Q;
  $('#eqs').innerHTML=Q.eq.map(line=>'<div class="eqrow">'+line.map(t=>{
    if(typeof t==='string')return `<span class="eqt">${t}</span>`;
    const f=Q.fields.find(x=>x.k===t.f),v=R.vals[t.f]||'';
    return `<div class="slotbox"><div class="slot ${R.active===t.f?'active':''} ${v===''?'empty':''} ${R.mark&&R.mark[t.f]||''}" data-act="t_focus" data-k="${t.f}" role="button" tabindex="0">${v===''?'?':v}</div><small>${esc(f.label)}</small></div>`;
  }).join('')+'</div>').join('');
  const sb=$('#submitbtn');if(sb)sb.disabled=R.phase!=='ask'||!Q.fields.every(f=>(R.vals[f.k]||'')!=='');
}
function press(k){
  if(!R||MODE!=='quiz'||R.phase!=='ask')return;
  let cur=R.vals[R.active]||'';if(cur.length>=3)cur='';cur+=k;R.vals[R.active]=cur;
  const f=R.Q.fields.find(x=>x.k===R.active);
  if(cur.length>=String(f.ans).length){const nx=R.Q.fields.find(x=>(R.vals[x.k]||'')==='');if(nx)R.active=nx.k;}
  renderEq();
}
function del(){
  if(!R||MODE!=='quiz'||R.phase!=='ask')return;
  const a=R.active;
  if((R.vals[a]||'')===''){const i=R.Q.fields.findIndex(x=>x.k===a);if(i>0)R.active=R.Q.fields[i-1].k;}
  else R.vals[a]=R.vals[a].slice(0,-1);
  renderEq();
}
function clearAll(){if(!R||R.phase!=='ask')return;R.vals={};R.active=R.Q.fields[0].k;renderEq();}
function submit(){
  if(!R||R.phase!=='ask')return;const Q=R.Q;
  if(!Q.fields.every(f=>(R.vals[f.k]||'')!==''))return;
  const ms=Date.now()-R.t0;
  const marks={};let ok=true;
  Q.fields.forEach(f=>{const g=String(parseInt(R.vals[f.k],10));const good=g===String(f.ans);marks[f.k]=good?'good':'bad';if(!good)ok=false;});
  R.mark=marks;R.phase='fb';
  const got=Q.fields.map(f=>R.vals[f.k]).join('…'),want=Q.fields.map(f=>f.ans).join('…');
  const quick=ms<2000;
  T.log.push({i:R.i,q:R.n,at:(T.nodes[R.i]?T.nodes[R.i].tries:0)+1,k:Q.kind,disp:Q.disp||Q.kind,ok,got,want,ms,quick,t:Date.now()});
  R.res.push(ok);if(ok)R.ok++;
  saveT();queueSync();
  renderEq();
  const fb=$('#fb');fb.hidden=false;fb.className='fb '+(ok?'ok':'bad');
  fb.innerHTML=ok?'<span class="big">答對了！</span>':`<span class="big">這題不對</span><br>正確答案：${Q.fields.map(f=>`${esc(f.label)} <b>${f.ans}</b>`).join('　')}${Q.ex&&Q.ex.lines?'<br><small>'+Q.ex.lines.join('<br>')+'</small>':''}`;
  $('#submitbtn').disabled=true;
  const last=R.n+1>=R.qs.length;
  const nr=$('#nextrow');nr.innerHTML=`<button class="btn gold big" id="nextbtn" data-act="t_next" disabled>${last?'看這關成績':'下一題'}</button>`;
  const wait=ok?500:2500;setTimeout(()=>{const b=$('#nextbtn');if(b)b.disabled=false;},wait);
}
function next(){
  if(!R||R.phase!=='fb')return;const b=$('#nextbtn');if(b&&b.disabled)return;
  R.n++;if(R.n>=R.qs.length)return finishNode();nextQ();
}
function finishNode(){
  const i=R.i,tot=R.qs.length,s=T.nodes[i]||{best:0,tries:0,done:false};
  s.tries++;s.done=true;s.best=Math.max(s.best,R.ok);T.nodes[i]=s;saveT();queueSync();
  const nd=NODES[i],sc=stars(R.ok/tot);
  const wrong=R.qs.map((q,j)=>({q,ok:R.res[j]})).filter(x=>!x.ok);
  MODE='result';
  topEl.innerHTML=`<div class="topin"><button class="logo" data-act="t_logo">餘數試煉</button></div>`;
  app.innerHTML=`<section class="tcard" style="text-align:center"><h2>${nd.e} ${esc(nd.n)}　完成！</h2>
   <div class="bigstar">${starStr(sc)}</div><div style="font-size:1.4rem;font-weight:900;margin:6px 0">答對 ${R.ok} / ${tot} 題</div>
   ${wrong.length?`<div style="text-align:left"><b>答錯的題目</b><ul class="mlist">${wrong.map(x=>`<li>${esc(x.q.disp||x.q.kind)}　正確：<span class="gd">${x.q.fields.map(f=>f.ans).join(' … ')}</span></li>`).join('')}</ul></div>`:'<div class="mute">全部答對，太強了！</div>'}
   <div class="row" style="justify-content:center;margin-top:14px"><button class="btn gold big" data-act="t_tomap">回地圖</button><button class="btn ghost" data-act="t_retry" data-i="${i}">再挑戰這關</button><button class="btn ghost sm" data-act="t_copy">複製回報給老師</button></div></section>`;
}
function showAll(){
  MODE='end';const L=T.log,ok=L.filter(e=>e.ok).length;
  topEl.innerHTML=`<div class="topin"><button class="logo" data-act="t_logo">餘數試煉</button></div>`;
  const best=NODES.reduce((s,_,i)=>s+(T.nodes[i]?T.nodes[i].best:0),0);
  app.innerHTML=`<section class="tcard" style="text-align:center"><h2>🏆 全部闖關完成！</h2>
   <div style="font-size:1.4rem;font-weight:900;margin:8px 0">各關最佳成績 ${best} / ${TOTAL}</div>
   <ul class="mlist" style="text-align:left">${NODES.map((n,i)=>`<li>${n.e} ${i+1}. ${esc(n.n)}　<b>${T.nodes[i]?T.nodes[i].best:0}/${nodeTotal(i)}</b>　${starStr(stars((T.nodes[i]?T.nodes[i].best:0)/nodeTotal(i)))}</li>`).join('')}</ul>
   <div class="row" style="justify-content:center;margin-top:14px"><button class="btn gold" data-act="t_tomap">回地圖（可重挑戰）</button><button class="btn mint" data-act="t_copy">複製回報給老師</button></div></section>`;
}

/* --- 老師看板 --- */
let TUNSUB=null,ACTIVE=false;const TRIALHIDE=()=>{ACTIVE=false;if(TUNSUB){try{TUNSUB();}catch(e){}TUNSUB=null;}};
function enterTeacher(){
  MODE='teacher';topEl.innerHTML=`<div class="topin"><button class="logo" data-act="t_logo">餘數試煉・老師</button><span class="sp"></span><button class="btn sm ghost" data-act="t_leave">回到地圖</button></div>`;
  app.innerHTML='<div class="tcard">讀取中…</div>';
  (async()=>{
    const db=SYNC.db||await (async()=>{try{return await window.claude.use('db');}catch(e){return null;}})();
    if(db){try{TUNSUB=db.collection('trials').onSnapshot(snap=>{const rows=[];snap.forEach?snap.forEach(d=>rows.push(d.data?d.data():d)):(snap.docs||[]).forEach(d=>rows.push(d.data()));renderTeacher(rows);},()=>renderTeacher([payload()]));return;}catch(e){}}
    renderTeacher(T.log.length?[payload()]:[]);
  })();
}
function repFor(r){
  const old=T;T={sid:r.sid,nodes:r.nodes||{},log:r.log||[]};const s=buildReport();T=old;return s;
}
function renderTeacher(rows){
  if(MODE!=='teacher')return;
  rows=(rows||[]).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if(!rows.length){app.innerHTML='<div class="tcard">還沒有紀錄。他完成一題後就會出現在這裡。</div>';return;}
  const r=rows[0],L=r.log||[];
  const t=r.startedAt?Math.round(((r.updatedAt||Date.now())-r.startedAt)/60000):0;
  app.innerHTML=`<div class="tcard"><b>最新一次：${new Date(r.updatedAt||Date.now()).toLocaleString('zh-TW')}</b>　<small>共 ${rows.length} 份紀錄・約 ${t} 分鐘</small>
   <ul class="mlist">${NODES.map((n,i)=>{const s=(r.nodes||{})[i];return `<li>${n.e} ${i+1}. ${esc(n.n)}　${s?`<b>最佳 ${s.best}/${nodeTotal(i)}</b>　挑戰 ${s.tries} 次`:'<small>未開始</small>'}</li>`;}).join('')}</ul>
   <h3 style="margin-top:14px">作答紀錄（最近 40 題）</h3>
   <div style="overflow-x:auto"><table class="tb"><tr><th>關</th><th>題目</th><th>他寫</th><th>正解</th><th>秒</th></tr>${L.slice(-40).map(e=>`<tr class="${e.ok?'':'x'}"><td>${e.i+1}</td><td>${esc(e.disp)}${e.quick?' ⚡':''}</td><td>${esc(e.got)}</td><td>${esc(e.want)}</td><td>${Math.round(e.ms/1000)}</td></tr>`).join('')}</table></div>
   <small>⚡＝2 秒內就送出（可能亂按）</small>
   <h3 style="margin-top:14px">貼 Discord 的版本</h3><pre class="rep" id="repbox">${esc(repFor(r))}</pre>
   <div class="row"><button class="btn mint sm" data-act="t_copyrep">複製</button><button class="btn coral sm" data-act="t_reset">清除這台瀏覽器的進度</button></div></div>`;
}
function leaveTeacher(){if(TUNSUB){try{TUNSUB();}catch(e){}TUNSUB=null;}showMap();}

/* --- 事件 --- */
let logoClicks=[],resetArm=0;
document.addEventListener('click',e=>{
  if(!ACTIVE)return;const b=e.target.closest('[data-act]');if(!b||!b.dataset.act.startsWith('t_'))return;const a=b.dataset.act.slice(2);
  if(a==='key')press(b.dataset.k);else if(a==='del')del();else if(a==='clear')clearAll();
  else if(a==='focus'){if(R&&R.phase==='ask'){R.active=b.dataset.k;renderEq();}}
  else if(a==='submit')submit();else if(a==='next')next();
  else if(a==='node'){const i=+b.dataset.i;if(avail(i))startNode(i);}
  else if(a==='retry')startNode(+b.dataset.i);
  else if(a==='tomap')showMap();else if(a==='allend')showAll();
  else if(a==='copy')copyText(buildReport(),b);
  else if(a==='copyrep')copyText($('#repbox').textContent,b);
  else if(a==='leave')leaveTeacher();
  else if(a==='tolesson'){TRIALHIDE();backToLesson();}
  else if(a==='reset'){if(Date.now()-resetArm<4000){T=newT();saveT();leaveTeacher();}else{resetArm=Date.now();b.textContent='再按一次確定清除';}}
  else if(a==='logo'){const n=Date.now();logoClicks=logoClicks.filter(t=>n-t<2500);logoClicks.push(n);if(logoClicks.length>=5){logoClicks=[];enterTeacher();}}
});
document.addEventListener('keydown',e=>{
  if(!ACTIVE||MODE!=='quiz')return;
  if(R.phase==='ask'){
    if(/^[0-9]$/.test(e.key))press(e.key);
    else if(e.key==='Backspace'){e.preventDefault();del();}
    else if(e.key==='Enter'){e.preventDefault();submit();}
    else if(e.key==='Tab'){e.preventDefault();const fs=R.Q.fields,j=fs.findIndex(f=>f.k===R.active);R.active=fs[(j+1)%fs.length].k;renderEq();}
  }else if(R.phase==='fb'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();next();}
});
initSync();
return {show(){ACTIVE=true;renderFoot();showMap();},hide(){ACTIVE=false;if(TUNSUB){try{TUNSUB();}catch(e){}TUNSUB=null;}}};

})();

</script>
</body>
</html>
